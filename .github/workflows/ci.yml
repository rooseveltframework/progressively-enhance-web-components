on: [push, pull_request]
name: CI
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all CI failures rather than stopping CI on first failure
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test-node
      - run: npm run coverage
      # the browser tests drive the express sample app, which brings its own dependencies and needs a browser to be driven in
      - run: npm ci
        working-directory: sampleApps/express
      - run: npx playwright install --with-deps chromium
      - run: npm run test-browser
